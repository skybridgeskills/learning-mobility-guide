name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install

      - name: Run tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm test
        env:
          KEY_SEED_EXAMPLE: ${{ secrets.KEY_SEED_EXAMPLE }}
          CLIENT_SECRET_EXAMPLE: ${{ secrets.CLIENT_SECRET_EXAMPLE }}

      - name: Upload reports
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download reports (current run)
        uses: actions/download-artifact@v4
        with:
          name: reports
        continue-on-error: true
        id: download-current

      - name: Download reports (previous run)
        if: steps.download-current.outcome == 'failure'
        uses: dawidd6/action-download-artifact@v6
        with:
          name: reports
          workflow: pages.yml
          workflow_search: true
          search_artifacts: true
          branch: main
          path: reports
          if_no_artifact_found: ignore

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - uses: actions/configure-pages@v4
        id: pages

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Copy reports to site
        run: |
          if [ -d reports ] && [ "$(ls -A reports 2>/dev/null)" ]; then
            mkdir -p _site/reports
            cp -r reports/* _site/reports/
          fi

      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
