profile_id: vcalm-eddsa-v1
profile_name: VCALM EdDSA Profile
version: 0.0.1
description: |
  Profile using VCALM Exchanges for credential issuance and presentation with EdDSA signatures.
  This profile is optimized for browser-based credential exchange workflows.

last_updated: 2025-10-15
status: active

# Profile metadata
metadata:
  use_cases:
    - browser-based credential exchange
    - educational credential issuance and verification
    - skills-based hiring workflows
    - cross-institutional credential transfer
  target_audience:
    - educational institutions
    - certification bodies
    - employers
    - credential wallet providers
  compliance_notes:
    - \"MUST\" indicates mandatory requirements for conformance
    - \"SHOULD\" indicates recommended practices
    - \"MAY\" indicates optional capabilities

# Role-specific requirements
roles:
  issuer:
    required_capabilities:
      - credential_creation:
          description: "Create W3C Verifiable Credentials with Open Badges 3.0 schema"
          requirements:
            - MUST generate W3C Verifiable Credentials Data Model 2.0 compliant credentials
            - MUST use Open Badges 3.0 credential schema
            - MUST include all mandatory Open Badges 3.0 fields
            - MUST support credential expiration dates
            - MUST implement credential versioning
      - cryptographic_signing:
          description: "Sign credentials using EdDSA with RDF Dataset Canonicalization"
          requirements:
            - MUST use eddsa-rdfc-2022 cryptographic suite
            - MUST use Ed25519 signature algorithm
            - MUST include proof creation date in Data Integrity proof
            - MUST include verification method reference in proof
            - MUST support key rotation and revocation
      - vcalm_exchanges:
          description: "Implement VCALM Exchanges protocol for credential delivery"
          requirements:
            - MUST implement VCALM Exchanges specification
            - MUST support credential offer generation
            - MUST handle credential request processing
            - MUST provide credential delivery endpoint
            - MUST implement proper error handling and status codes
      - status_management:
          description: "Implement Bitstring Status List for credential status"
          requirements:
            - MUST maintain current Bitstring Status List
            - MUST sign status list with issuer key
            - MUST provide status list endpoint
            - MUST update status list when credentials are revoked
            - MUST handle status list versioning
      - did_management:
          description: "Manage issuer identity using supported DID methods"
          requirements:
            - MUST support did:web or did:key DID methods
            - MUST maintain current DID document
            - MUST include verification methods for Ed25519 keys
            - MUST support DID resolution
    protocols:
      - name: VCALM Exchanges
        version: "1.0"
        specification: "https://w3c.github.io/vc-api/"
        endpoints:
          - credential_offer: "/credential-offer"
          - credential_request: "/credential-request"
          - credential_delivery: "/credential-delivery"
          - status_list: "/status-list"

  wallet:
    required_capabilities:
      - credential_storage:
          description: "Securely store and manage verifiable credentials"
          requirements:
            - MUST provide secure storage for W3C Verifiable Credentials
            - MUST preserve original credential proofs and signatures
            - MUST support credential organization and categorization
            - MUST implement credential backup and recovery
            - MUST provide credential sharing controls
      - credential_display:
          description: "Display Open Badges 3.0 credentials to users"
          requirements:
            - MUST render Open Badges 3.0 credentials with proper formatting
            - MUST display credential metadata and evidence
            - MUST show credential status and expiration
            - MUST provide credential sharing interface
            - MUST support credential export in standard formats
      - vcalm_exchanges:
          description: "Implement VCALM Exchanges protocol for credential reception and presentation"
          requirements:
            - MUST implement VCALM Exchanges specification
            - MUST handle credential offers from issuers
            - MUST process credential requests from verifiers
            - MUST provide credential presentation interface
            - MUST implement user consent mechanisms
      - signature_verification:
          description: "Verify EdDSA signatures on received credentials"
          requirements:
            - MUST verify eddsa-rdfc-2022 signatures
            - MUST resolve issuer DIDs to obtain verification keys
            - MUST validate proof creation dates and expiration
            - MUST handle signature verification failures gracefully
      - status_checking:
          description: "Check credential status using Bitstring Status List"
          requirements:
            - MUST implement Bitstring Status List checking
            - MUST provide real-time status verification
            - MUST cache status information appropriately
            - MUST handle status service unavailability
      - did_management:
          description: "Manage holder identity using supported DID methods"
          requirements:
            - MUST support did:web or did:key DID methods
            - MUST generate and manage Ed25519 key pairs
            - MUST maintain current DID document
            - MUST support DID resolution
    protocols:
      - name: VCALM Exchanges
        version: "1.0"
        specification: "https://w3c.github.io/vc-api/"
        capabilities:
          - credential_reception
          - credential_presentation
          - selective_disclosure

  verifier:
    required_capabilities:
      - credential_validation:
          description: "Validate received verifiable credentials"
          requirements:
            - MUST validate W3C Verifiable Credentials Data Model 2.0 compliance
            - MUST verify Open Badges 3.0 schema compliance
            - MUST check required fields and data types
            - MUST validate credential expiration dates
            - MUST implement comprehensive validation error handling
      - signature_verification:
          description: "Verify EdDSA signatures on received credentials"
          requirements:
            - MUST verify eddsa-rdfc-2022 signatures
            - MUST resolve issuer DIDs to obtain verification keys
            - MUST validate proof creation dates and expiration
            - MUST handle signature verification failures gracefully
            - MUST implement proper error logging and reporting
      - vcalm_exchanges:
          description: "Implement VCALM Exchanges protocol for credential requests"
          requirements:
            - MUST implement VCALM Exchanges specification
            - MUST generate credential requests with proper scopes
            - MUST handle credential presentations from wallets
            - MUST implement proper error handling and status codes
            - MUST provide credential request endpoint
      - status_verification:
          description: "Verify credential status using Bitstring Status List"
          requirements:
            - MUST implement Bitstring Status List verification
            - MUST check credential status before acceptance
            - MUST validate status list signature and freshness
            - MUST handle status service unavailability
            - MUST cache status information appropriately
      - trust_registry_integration:
          description: "Integrate with trust registries for issuer validation"
          requirements:
            - MUST query trust registries for issuer authorization
            - MUST validate issuer credentials and accreditation
            - MUST check for issuer revocation or suspension
            - MUST maintain current trust registry data
            - MUST implement trust registry query protocols
      - audit_logging:
          description: "Maintain audit logs for verification activities"
          requirements:
            - MUST log all credential verification attempts
            - MUST log verification results and decisions
            - MUST maintain audit trail for compliance
            - MUST implement secure log storage and retention
    protocols:
      - name: VCALM Exchanges
        version: "1.0"
        specification: "https://w3c.github.io/vc-api/"
        endpoints:
          - credential_request: "/credential-request"
          - credential_presentation: "/credential-presentation"

# Technical specifications
credential_format:
  data_model: "W3C Verifiable Credentials Data Model 2.0"
  credential_type: "Open Badges 3.0"
  proof_type: "DataIntegrityProof"
  cryptographic_suite: "eddsa-rdfc-2022"
  
  schema_requirements:
    mandatory_fields:
      - "@context"
      - "type"
      - "issuer"
      - "credentialSubject"
      - "proof"
    optional_fields:
      - "evidence"
      - "alignment"
      - "endorsement"
      - "expirationDate"
      - "issuanceDate"
    
  validation_rules:
    - MUST validate JSON-LD structure
    - MUST validate Open Badges 3.0 schema compliance
    - MUST validate credential expiration dates
    - MUST validate issuer DID format
    - MUST validate credential subject structure

# Cryptographic specifications
cryptography:
  signature_algorithm: "EdDSA"
  curve: "Ed25519"
  proof_suite: "eddsa-rdfc-2022"
  key_types:
    - "Ed25519VerificationKey2020"
    - "JsonWebKey2020"
  
  key_management:
    - MUST support key generation and storage
    - MUST support key rotation and revocation
    - MUST implement secure key backup and recovery
    - MUST support hardware security module integration

# DID specifications
did_methods:
  supported:
    - method: "did:web"
      requirements:
        - MUST resolve to HTTPS URLs
        - MUST serve DID documents with proper content-type headers
        - MUST include verification methods for Ed25519 keys
        - MUST support DID document updates
    - method: "did:key"
      requirements:
        - MUST use Ed25519 keys
        - MUST follow did:key specification for key encoding
        - MUST include verification methods in DID document
        - MUST support key rotation

# Status management
status_method:
  type: "Bitstring Status List"
  specification: "https://w3c.github.io/vc-status-list-2021/"
  
  issuer_requirements:
    - MUST maintain current status list
    - MUST sign status list with issuer key
    - MUST provide status list endpoint
    - MUST update status list when credentials are revoked
    - MUST handle status list versioning
  
  verifier_requirements:
    - MUST check credential status before acceptance
    - MUST validate status list signature
    - MUST handle status service unavailability
    - MUST cache status information appropriately

# Trust infrastructure
trust_registry:
  integration_required: true
  
  capabilities:
    - issuer_authorization_query
    - issuer_credential_validation
    - issuer_revocation_check
    - trust_registry_data_maintenance
  
  protocols:
    - "Trust Registry Query Protocol (TRQP)"
    - "OpenID Federation"
    - "X.509 certificate chains"

# Security requirements
security:
  data_protection:
    - MUST implement data encryption at rest
    - MUST implement data encryption in transit
    - MUST implement proper access controls
    - MUST implement audit logging
  
  privacy:
    - MUST implement user consent mechanisms
    - MUST support selective disclosure
    - MUST implement data minimization
    - MUST comply with applicable privacy regulations
  
  threat_mitigation:
    - MUST implement protection against replay attacks
    - MUST implement protection against credential forgery
    - MUST implement protection against key compromise
    - MUST implement protection against status list manipulation

# Testing and validation
testing:
  conformance_testing:
    - MUST pass all profile-specific conformance tests
    - MUST demonstrate interoperability with other profile-conformant systems
    - MUST provide test results and evidence
  
  interoperability_testing:
    - MUST participate in interoperability testing events
    - MUST demonstrate end-to-end credential workflows
    - MUST validate cross-vendor compatibility
  
  security_testing:
    - MUST undergo security audit and penetration testing
    - MUST implement vulnerability disclosure process
    - MUST maintain security incident response plan

# Implementation notes
implementation_notes:
  - "This profile is optimized for browser-based credential exchange"
  - "EdDSA signatures provide strong security with efficient performance"
  - "VCALM Exchanges enable seamless web application integration"
  - "Profile conformance requires implementation of all mandatory requirements"
  - "Optional extensions may be implemented for enhanced functionality"
