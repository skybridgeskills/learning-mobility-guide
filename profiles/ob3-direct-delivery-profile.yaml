profile_id: ob3-direct-delivery-v1
profile_name: OB 3.0 Direct Delivery Profile
version: 0.0.1
description: |
  Profile using EdDSA cryptographic signatures with Open Badges 3.0 schema for direct credential issuance and verification.
  This profile supports direct-download/copy JSON and upload/paste workflows without protocol-based delivery.
  Uses email address-based identifiers for recipients in credentialSubject.

last_updated: 2026-02-14
status: active

# Profile metadata
metadata:
  use_cases:
    - direct credential download and file sharing
    - email-based credential delivery
    - copy-paste credential workflows
    - simple credential issuance without wallet integration
  target_audience:
    - educational institutions
    - certification bodies
    - employers
    - credential verification systems
  compliance_notes:
    - \"MUST\" indicates mandatory requirements for conformance
    - \"SHOULD\" indicates recommended practices
    - \"MAY\" indicates optional capabilities

# Workflow-based requirements
workflows:
  direct_credential_issuance:
    description: "Workflow for issuers to create and deliver credentials directly as downloadable files or copy-paste JSON"
    participating_roles: [issuer]
    interoperability_requirements:
      issuer:
        - credential_creation:
            description: "Create W3C Verifiable Credentials with Open Badges 3.0 schema"
            requirements:
              - MUST generate W3C Verifiable Credentials Data Model 2.0 compliant credentials
              - MUST use Open Badges 3.0 credential schema
              - MUST include all mandatory Open Badges 3.0 fields
              - MUST support credential expiration dates
              - MUST implement credential versioning
              - MUST use email address-based identifiers for credentialSubject (per Open Badges 3.0 spec)
        - cryptographic_signing:
            description: "Sign credentials using EdDSA with RDF Dataset Canonicalization"
            requirements:
              - MUST use eddsa-rdfc-2022 cryptographic suite
              - MUST use Ed25519 signature algorithm
              - MUST include proof creation date in Data Integrity proof
              - MUST include verification method reference in proof
        - credential_delivery:
            description: "Provide credentials as downloadable files or copy-paste JSON"
            requirements:
              - MUST provide credential as downloadable file (JSON format)
              - MUST provide credential as copy-paste JSON text
              - MUST ensure credential can be saved and shared by recipients
              - MUST implement proper file format validation
        - status_management:
            description: "Implement Bitstring Status List for credential status"
            requirements:
              - MUST maintain current Bitstring Status List
              - MUST sign status list with issuer key
              - MUST provide status list endpoint
        - did_management:
            description: "Manage issuer identity using supported DID methods"
            requirements:
              - MUST support did:web or did:key DID methods
              - MUST maintain current DID document
              - MUST include verification methods for Ed25519 keys
              - MUST support DID resolution
              - MAY support DID documents with multiple verification methods
    internal_practices:
      issuer:
        - key_rotation_policies:
            description: "Internal key management practices"
            requirements:
              - SHOULD implement key rotation policies
              - SHOULD implement secure key backup and recovery
              - SHOULD support hardware security module integration
        - status_list_versioning:
            description: "Internal status list management"
            requirements:
              - SHOULD handle status list versioning
              - SHOULD update status list when credentials are revoked
        - user_authentication:
            description: "Internal user authentication for credential requests"
            requirements:
              - SHOULD implement secure user authentication (SSO/login)
              - SHOULD verify user identity before credential issuance
    protocols: []

  direct_credential_verification:
    description: "Workflow for verifiers to validate credentials received as files or copy-paste JSON"
    participating_roles: [verifier]
    interoperability_requirements:
      verifier:
        - credential_import:
            description: "Import credentials from files or copy-paste JSON"
            requirements:
              - MUST accept credentials as JSON files
              - MUST accept credentials as copy-paste JSON text
              - MUST validate JSON structure before processing
              - MUST handle malformed credentials gracefully
        - credential_validation:
            description: "Validate received verifiable credentials"
            requirements:
              - MUST validate W3C Verifiable Credentials Data Model 2.0 compliance
              - MUST verify Open Badges 3.0 schema compliance
              - MUST check required fields and data types
              - MUST validate credential expiration dates
              - MUST implement comprehensive validation error handling
        - signature_verification:
            description: "Verify EdDSA signatures on received credentials"
            requirements:
              - MUST verify eddsa-rdfc-2022 signatures
              - MUST resolve issuer DIDs to obtain verification keys
              - MUST validate proof creation dates and expiration
              - MUST handle signature verification failures gracefully
        - status_verification:
            description: "Verify credential status using Bitstring Status List"
            requirements:
              - MUST implement Bitstring Status List verification
              - MUST check credential status before acceptance
              - MUST validate status list signature and freshness
              - MUST handle status service unavailability
              - MUST cache status information appropriately
        - trust_registry_integration:
            description: "Integrate with trust registries for issuer validation"
            requirements:
              - MUST query trust registries for issuer authorization
              - MUST validate issuer credentials and accreditation
              - MUST check for issuer revocation or suspension
              - MUST implement trust registry query protocols
        - threat_mitigation:
            description: "Protect against common attacks"
            requirements:
              - MUST implement protection against replay attacks
              - MUST implement protection against credential forgery
              - MUST implement protection against status list manipulation
    internal_practices:
      verifier:
        - error_logging:
            description: "Internal error logging and reporting"
            requirements:
              - SHOULD implement proper error logging and reporting
        - trust_registry_maintenance:
            description: "Internal trust registry data management"
            requirements:
              - SHOULD maintain current trust registry data

# Internal operation requirements
# These requirements cannot be tested via interoperability workflows but may be important for procurement
internal_operation_requirements:
  issuer:
    - key_management:
        description: "Internal key management operations"
        requirements:
          - SHOULD support key rotation and revocation policies
          - SHOULD implement secure key backup and recovery
          - SHOULD support hardware security module integration
    - status_management:
        description: "Internal status list management"
        requirements:
          - SHOULD update status list when credentials are revoked
          - SHOULD handle status list versioning
    - data_protection:
        description: "Internal data protection"
        requirements:
          - SHOULD implement data encryption at rest
          - SHOULD implement proper access controls
    - audit_logging:
        description: "Internal audit and logging"
        requirements:
          - SHOULD implement audit logging
  verifier:
    - data_protection:
        description: "Internal data protection"
        requirements:
          - SHOULD implement data encryption at rest
          - SHOULD implement proper access controls
    - error_logging:
        description: "Internal error logging"
        requirements:
          - SHOULD implement proper error logging and reporting
    - trust_registry_maintenance:
        description: "Internal trust registry management"
        requirements:
          - SHOULD maintain current trust registry data
    - privacy:
        description: "Internal privacy practices"
        requirements:
          - SHOULD implement data minimization
          - SHOULD comply with applicable privacy regulations

# Technical specifications
credential_format:
  data_model: "W3C Verifiable Credentials Data Model 2.0"
  credential_type: "Open Badges 3.0"
  proof_type: "DataIntegrityProof"
  cryptographic_suite: "eddsa-rdfc-2022"
  
  schema_requirements:
    mandatory_fields:
      - "@context"
      - "type"
      - "issuer"
      - "credentialSubject"
      - "proof"
    optional_fields:
      - "evidence"
      - "alignment"
      - "endorsement"
      - "expirationDate"
      - "issuanceDate"
    
  validation_rules:
    - MUST validate JSON-LD structure
    - MUST validate Open Badges 3.0 schema compliance
    - MUST validate credential expiration dates
    - MUST validate issuer DID format
    - MUST validate credential subject structure
    - MUST validate email-based identifiers in credentialSubject

# Cryptographic specifications
cryptography:
  signature_algorithm: "EdDSA"
  curve: "Ed25519"
  proof_suite: "eddsa-rdfc-2022"
  key_types:
    - "Ed25519VerificationKey2020"
    - "JsonWebKey2020"

# DID specifications
did_methods:
  supported:
    - method: "did:web"
      requirements:
        - MUST resolve to HTTPS URLs
        - MUST serve DID documents with proper content-type headers
        - MUST include verification methods for Ed25519 keys
        - MUST support DID document updates
    - method: "did:key"
      requirements:
        - MUST use Ed25519 keys
        - MUST follow did:key specification for key encoding
        - MUST include verification methods in DID document

# Status management
status_method:
  type: "Bitstring Status List"
  specification: "https://w3c.github.io/vc-status-list-2021/"

# Trust infrastructure
trust_registry:
  integration_required: true
  
  capabilities:
    - issuer_authorization_query
    - issuer_credential_validation
    - issuer_revocation_check
  
  protocols:
    - "Trust Registry Query Protocol (TRQP)"
    - "OpenID Federation"
    - "X.509 certificate chains"

# Testing and validation
testing:
  conformance_testing:
    - MUST pass all profile-specific conformance tests
    - MUST demonstrate interoperability with other profile-conformant systems
    - MUST provide test results and evidence
  
  interoperability_testing:
    - MUST participate in interoperability testing events
    - MUST demonstrate end-to-end credential workflows
    - MUST validate cross-vendor compatibility

# Implementation notes
implementation_notes:
  - "This profile supports direct credential download and file sharing workflows"
  - "EdDSA signatures provide strong security with efficient performance"
  - "Email-based identifiers enable simple credential delivery without wallet integration"
  - "Profile conformance requires implementation of all mandatory requirements"
  - "Optional extensions may be implemented for enhanced functionality"
  - "Requirements are organized by workflow to clarify interoperability testing scope"
  - "Internal operation requirements cannot be tested via interoperability but may be important for procurement"
  - "No protocol-based delivery is required - credentials are provided as files or JSON text"
